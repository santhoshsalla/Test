# Application under test
base.url=https://your-app-under-test.example

# Navigation URLs (adjust for your application)
plp.url=/products
pdp.url.template=/product/%s
search.url=/search?q=%s
cart.url=/cart
login.url=/login

# Test data (SKUs)
sku.in.stock.1=SKU_IN_STOCK_1
sku.in.stock.2=SKU_IN_STOCK_2
sku.limited.stock=SKU_LIMITED_STOCK
sku.limited.stock.max=5

# Guest persistence decision: true = persistent across browser restart, false = session-only
guest.cart.persistent=false

# Cart merge rule on login (MERGE | KEEP_GUEST | KEEP_ACCOUNT)
cart.merge.rule=MERGE

# Login credentials (required for TC-CART-021)
user.email=test.user@example.com
user.password=Password123

# Storage keys for cart token/state (used by TC-CART-020)
cart.token.localstorage.key=cartToken
cart.token.cookie.key=cartToken

# Optional: URL that forces add-to-cart failure (used by TC-CART-022). Leave blank to skip.
mock.addtocart.failure.url=

# Browser
browser=chrome
headless=false
implicit.wait.seconds=0
explicit.wait.seconds=15
