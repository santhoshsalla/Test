# Do not remove existing keys. Append new keys below.

# Application under test
baseUrl=https://your-storefront-url.example

# Browser config: chrome | firefox
browser=chrome

# Timeouts (seconds)
explicitWait=15
pageLoadTimeout=30

# Test data
productA.sku=A123
productB.sku=B234
productC.sku=C345
productD.sku=D456

# Pages (relative paths)
plpPath=/category/product-a
pdpPath.productB=/product/B234
searchPath=/search?q=C345
cartPath=/cart
loginPath=/login

# Optional: Cart API base URL for backend-authoritative totals validation
# Example: https://your-storefront-url.example/api
cartApiBaseUrl=

# Optional: API endpoints (relative)
cartApiGetPath=/cart
cartApiAddPath=/cart/items

# Optional: Add-to-cart XHR URL pattern used for network failure simulation (TC-20026)
addToCartUrlPattern=/cart/items
